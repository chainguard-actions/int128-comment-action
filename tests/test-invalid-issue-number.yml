name: Test error on invalid issue-number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with non-numeric issue-number (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          post: "Hello world"
          issue-number: "not-a-number"
          # "not-a-number" is not a valid integer — action should throw
          # "issue-number is an invalid number"
      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid issue-number"
            exit 1
          fi
          echo "PASS: action correctly failed with non-numeric issue-number"
