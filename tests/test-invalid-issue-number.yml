name: Test invalid issue-number value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-numeric issue-number
        id: action
        uses: .
        with:
          post: "Hello world"
          issue-number: "not-a-number"
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid issue-number, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with non-numeric issue-number"
