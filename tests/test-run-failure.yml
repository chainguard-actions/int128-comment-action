name: Test run command failure (no post-on-failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with a failing command and no post-on-failure
        id: action
        uses: .
        with:
          run: exit 1
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when command exited with non-zero code"
