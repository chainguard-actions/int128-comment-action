name: Test invalid update-if-exists value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid update-if-exists value (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          post: "Hello world"
          update-if-exists: "invalid-value"
        # update-if-exists must be replace, append, or recreate — any other value should throw

      - name: Assert action failed due to invalid update-if-exists
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid update-if-exists value, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid update-if-exists value"
