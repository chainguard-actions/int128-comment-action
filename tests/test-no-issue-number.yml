name: Test no issue number provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          post: |
            This comment has no issue number set
      - name: Assert action ran without crashing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without an issue-number and not in a PR context, the action should
          # either skip gracefully (success with no-op) or fail gracefully.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no-op when no issue number)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no issue number to post to)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
