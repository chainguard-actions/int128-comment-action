name: Test basic post comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: octocat/Hello-World
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action starts and fails with invalid token (expected)
        id: action
        uses: .
        with:
          post: "Hello from comment-action test"
          issue-number: "1"
          repository: octocat/Hello-World
          token: "invalid-token-for-testing"
        continue-on-error: true
      - name: Assert action ran (failed due to invalid token, not startup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid token (API call fails),
          # not because of a startup/configuration error.
          # Either 'success' or 'failure' is acceptable here — what matters is
          # the action actually executed (not 'skipped' or missing).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
