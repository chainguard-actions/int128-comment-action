name: Test run command failure without post-on-failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with a failing command and no post-on-failure (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          run: "exit 1"
          # No post-on-failure means no comment is posted, but action still throws
          # "Command exited with code 1"
      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when run command exits non-zero"
            exit 1
          fi
          echo "PASS: action correctly failed when run command exited with non-zero code"
