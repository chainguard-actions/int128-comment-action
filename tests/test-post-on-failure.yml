name: Test post-on-failure with failing command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with post-on-failure set and a failing command
        id: action
        uses: .
        continue-on-error: true
        with:
          run: "false"
          post-on-failure: "Command failed!"
        # Command fails (exit code 1) and post-on-failure is set, but under workflow_dispatch
        # there are no associated PRs, so no API calls are made.
        # The action still throws an error because the command failed.

      - name: Assert action failed due to command failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when run command exits non-zero with post-on-failure set, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when run command exited with non-zero code and post-on-failure was set"
