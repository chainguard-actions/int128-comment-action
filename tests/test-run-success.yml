name: Test run command on success
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with a successful command
        id: action
        uses: .
        with:
          run: "echo hello"
        # Command succeeds, no post-on-success set, so no API calls are made.
        # Under workflow_dispatch there are no associated PRs.
        # Action should complete successfully.

      - name: Assert action completed successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when run command exits 0, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly succeeded with run command"
