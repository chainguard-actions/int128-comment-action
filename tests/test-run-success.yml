name: Test run command success (no comment posted)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with a successful command and no post-on-success
        id: action
        uses: .
        with:
          run: echo "hello from comment-action"
          # post-on-success is not set, so no comment is posted
          # issue-number is not set, so even if post-on-success were set it would look up PRs

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error"
