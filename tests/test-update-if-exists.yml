name: Test update-if-exists replace mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: octocat/Hello-World
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action with update-if-exists replace
        id: action
        uses: .
        with:
          post: "Updated comment content"
          update-if-exists: "replace"
          update-if-exists-key: "test-key"
          issue-number: "1"
          repository: octocat/Hello-World
          token: "invalid-token-for-testing"
        continue-on-error: true
      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
