name: Test error when neither post nor run is set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without post or run (should fail)
        id: action
        uses: .
        continue-on-error: true
        # Neither post nor run is set — the action should throw an error

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when neither post nor run is set, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when neither post nor run was provided"
