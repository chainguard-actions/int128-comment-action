name: Test run command without posting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with a command but no post-on-success or post-on-failure
        id: action
        uses: .
        with:
          run: "echo hello"
        # Command succeeds, no post-on-success set, so nothing is posted.
        # Action should complete successfully without any API calls.

      - name: Assert action completed successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when run command exits 0 with no post-on-success, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly succeeded with run command and no post-on-success"
